<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="stadiumSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7EFE6"/>
      <stop offset="100%" stop-color="#F2FAF6"/>
    </linearGradient>
    <linearGradient id="grassField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="jerseyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103F35"/>
      <stop offset="100%" stop-color="#1B6353"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="400" height="260" rx="16" fill="url(#stadiumSky)"/>

  <!-- Distant Stadium Light Towers / Goal Net Backdrop -->
  <g stroke="#90A4AE" stroke-width="2" opacity="0.6">
    <!-- Goal Net Lines -->
    <rect x="250" y="80" width="130" height="120" fill="#FFFFFF" fill-opacity="0.3" stroke="#78909C" stroke-width="3" rx="4"/>
    <line x1="275" y1="80" x2="275" y2="200"/>
    <line x1="300" y1="80" x2="300" y2="200"/>
    <line x1="325" y1="80" x2="325" y2="200"/>
    <line x1="350" y1="80" x2="350" y2="200"/>
    <line x1="250" y1="110" x2="380" y2="110"/>
    <line x1="250" y1="140" x2="380" y2="140"/>
    <line x1="250" y1="170" x2="380" y2="170"/>
  </g>

  <!-- Sports Field Green Grass -->
  <path d="M-10 195 Q180 185 410 195 L410 260 L-10 260 Z" fill="url(#grassField)"/>
  <!-- Field Chalk Line -->
  <path d="M-10 220 Q190 205 410 220" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.8"/>
  <ellipse cx="200" cy="225" rx="70" ry="20" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.7"/>

  <!-- Left Side: Golden Championship Trophy & Training Cones -->
  <g transform="translate(35, 150)">
    <!-- Golden Trophy -->
    <path d="M20 25 L35 25 L32 50 Q27.5 58 27.5 65 L27.5 75 L15 75 L15 65 Q15 58 10 50 L8 25 Z" fill="#FFC107" stroke="#FFA000" stroke-width="1.5"/>
    <rect x="12" y="75" width="18" height="6" fill="#795548" rx="1"/>
    <!-- Trophy handles -->
    <path d="M8 30 Q0 35 8 45" stroke="#FFA000" stroke-width="2" fill="none"/>
    <path d="M35 30 Q43 35 35 45" stroke="#FFA000" stroke-width="2" fill="none"/>
    <polygon points="21,35 23,40 28,40 24,43 25,48 21,45 17,48 18,43 14,40 19,40" fill="#FFFFFF"/>

    <!-- Training Cone (Oranye) -->
    <polygon points="55,50 48,78 62,78" fill="#FF5722"/>
    <ellipse cx="55" cy="78" rx="9" ry="3" fill="#E64A19"/>
    <polygon points="55,58 52,66 58,66" fill="#FFFFFF"/>
  </g>

  <!-- Dynamic Motion Speed Lines around Ball -->
  <g stroke="#BC9954" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M190 195 Q230 190 265 175"/>
    <path d="M200 205 Q240 200 270 188"/>
  </g>

  <!-- Flying Soccer Ball (Bola Sepak) -->
  <g transform="translate(280, 160)">
    <circle cx="16" cy="16" r="15" fill="#FFFFFF" stroke="#212121" stroke-width="1.8"/>
    <!-- Classic Pentagons on Soccer Ball -->
    <polygon points="16,8 11,12 13,18 19,18 21,12" fill="#212121"/>
    <polygon points="8,15 4,18 5,23 9,23" fill="#212121"/>
    <polygon points="24,15 28,18 27,23 23,23" fill="#212121"/>
    <polygon points="16,25 12,28 14,31 18,31 20,28" fill="#212121"/>
    <line x1="16" y1="8" x2="16" y2="2" stroke="#212121" stroke-width="1.2"/>
    <line x1="11" y1="12" x2="6" y2="10" stroke="#212121" stroke-width="1.2"/>
    <line x1="21" y1="12" x2="26" y2="10" stroke="#212121" stroke-width="1.2"/>
    <!-- Motion aura -->
    <circle cx="16" cy="16" r="18" stroke="#FFC107" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.7"/>
  </g>

  <!-- Center Cartoon Character: Energetic Soccer Player Student -->
  <g transform="translate(130, 45)">
    <!-- Head -->
    <circle cx="40" cy="35" r="19" fill="#FFCC80"/>
    <!-- Sporty Hair (Spiky Short Hair) -->
    <path d="M22 30 Q40 10 58 26 Q55 18 45 15 Q35 15 25 22 Z" fill="#37474F"/>
    <path d="M38 15 L42 8 L46 16 Z" fill="#37474F"/>

    <!-- Happy Eyes & Smile -->
    <ellipse cx="34" cy="33" rx="2.5" ry="3.5" fill="#212121"/>
    <ellipse cx="48" cy="33" rx="2.5" ry="3.5" fill="#212121"/>
    <circle cx="35" cy="32" r="1" fill="#FFFFFF"/>
    <circle cx="49" cy="32" r="1" fill="#FFFFFF"/>
    <!-- Sporty sweatband / blushing -->
    <ellipse cx="30" cy="40" rx="3" ry="1.5" fill="#FF8A80" opacity="0.6"/>
    <ellipse cx="52" cy="40" rx="3" ry="1.5" fill="#FF8A80" opacity="0.6"/>
    <!-- Excited Smile -->
    <path d="M37 40 Q41 46 46 40 Z" fill="#D32F2F"/>

    <!-- Jersey (SMP Inshafuddin Green & White Jersey #10) -->
    <path d="M18 60 L62 60 L58 112 L22 112 Z" fill="url(#jerseyGrad)"/>
    <!-- White V-Neck Collar -->
    <polygon points="34,60 40,68 46,60" fill="#FFFFFF"/>
    <!-- White Shoulder Stripes -->
    <line x1="20" y1="62" x2="24" y2="76" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="60" y1="62" x2="56" y2="76" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Jersey Number "10" -->
    <text x="40" y="94" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">10</text>

    <!-- White Shorts -->
    <rect x="23" y="112" width="16" height="24" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1.5"/>
    <rect x="41" y="112" width="16" height="24" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1.5"/>
    <!-- Green side stripes on shorts -->
    <rect x="23" y="112" width="3" height="24" fill="#103F35"/>
    <rect x="54" y="112" width="3" height="24" fill="#103F35"/>

    <!-- Left Leg (Supporting Weight) -->
    <rect x="27" y="136" width="9" height="15" fill="#FFCC80"/>
    <!-- High Green Sock -->
    <rect x="26" y="148" width="11" height="22" fill="#103F35" rx="2"/>
    <line x1="26" y1="152" x2="37" y2="152" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Left Soccer Cleat (Sepatu Bola) -->
    <ellipse cx="30" cy="173" rx="11" ry="6" fill="#212121"/>
    <rect x="22" y="177" width="16" height="3" fill="#D32F2F" rx="1"/>

    <!-- Right Leg (Dynamic Kicking Pose towards the Ball) -->
    <g transform="rotate(-38 48 136)">
      <rect x="44" y="136" width="9" height="18" fill="#FFCC80"/>
      <!-- High Green Sock -->
      <rect x="43" y="150" width="11" height="22" fill="#103F35" rx="2"/>
      <line x1="43" y1="154" x2="54" y2="154" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Right Cleat Kicking -->
      <ellipse cx="48" cy="175" rx="11" ry="6" fill="#212121"/>
      <rect x="40" y="179" width="16" height="3" fill="#D32F2F" rx="1"/>
    </g>

    <!-- Dynamic Running / Kicking Arms -->
    <!-- Left Arm Forward -->
    <path d="M20 62 L4 80 L14 96" stroke="#103F35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="15" cy="97" r="4.5" fill="#FFCC80"/>

    <!-- Right Arm Outstretched for Balance -->
    <path d="M60 62 L78 78 L90 70" stroke="#103F35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="91" cy="69" r="4.5" fill="#FFCC80"/>
  </g>
</svg>
